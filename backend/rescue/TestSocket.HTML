<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <!-- thư viện: sockjs-client, stomp.js -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
        input { padding: 6px; margin: 4px; }
        button { padding: 6px 12px; margin: 4px; cursor: pointer; }
        #log { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #f9f9f9; }
        .section { border: 1px solid #ddd; padding: 12px; margin-bottom: 16px; border-radius: 6px; }
        h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h2>WebSocket Test</h2>

    <!-- ĐĂNG NHẬP -->
    <div class="section">
        <h3>1. Đăng nhập</h3>
        <input id="phoneInput" placeholder="Số điện thoại" />
        <input id="passwordInput" type="password" placeholder="Mật khẩu" />
        <button onclick="login()">Đăng nhập</button>
        <span id="loginStatus"></span>
    </div>

    <!-- KẾT NỐI WEBSOCKET -->
    <div class="section">
        <h3>2. Kết nối WebSocket</h3>
        <input id="jwtInput" placeholder="JWT (tự điền sau login)" style="width:400px" />
        <input id="userIdInput" placeholder="userId" />
        <button onclick="connect()">Kết nối</button>
        <button onclick="disconnect()">Ngắt kết nối</button>
    </div>

    <!-- GỬI TIN NHẮN -->
    <div class="section">
        <h3>3. Gửi tin nhắn</h3>
        <input id="receiverIdInput" placeholder="receiverId" />
        <input id="contentInput" placeholder="Nội dung tin nhắn" style="width:300px" />
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <!-- LOG -->
    <div class="section">
        <h3>Log</h3>
        <button onclick="clearLog()">Xóa log</button>
        <div id="log"></div>
    </div>

    <script>
        let stompClient = null;

        function log(msg) {
            const div = document.getElementById('log');
            div.innerHTML += `<p>${new Date().toLocaleTimeString()} — ${msg}</p>`;
            div.scrollTop = div.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function login() {
            const phone = document.getElementById('phoneInput').value;
            const password = document.getElementById('passwordInput').value;

            if (!phone || !password) {
                log('⚠️ Vui lòng nhập số điện thoại và mật khẩu');
                return;
            }

            try {
                // Thay URL đúng với server của bạn
                const res = await fetch('http://localhost:9090/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, password: password })
                });

                const data = await res.json();

                if (res.ok) {
                    const jwt = data.data.token;
                    const userId = data.data.id;

                    document.getElementById('jwtInput').value = jwt;
                    document.getElementById('userIdInput').value = userId;
                    document.getElementById('loginStatus').textContent = '✅ Đăng nhập thành công';

                    log(`✅ Đăng nhập thành công — userId: ${userId}`);
                } else {
                    log('❌ Đăng nhập thất bại: ' + (data.message || res.status));
                }
            } catch (e) {
                log('❌ Lỗi kết nối server: ' + e.message);
            }
        }

        function connect() {
            const jwt = document.getElementById('jwtInput').value;
            const userId = document.getElementById('userIdInput').value;

            if (!jwt || !userId) {
                log('⚠️ Vui lòng đăng nhập trước');
                return;
            }

            const socket = new SockJS('http://localhost:9090/api/v1/ws');
            stompClient = Stomp.over(socket);

            stompClient.connect(
                { Authorization: 'Bearer ' + jwt },
                function () {
                    log('✅ WebSocket kết nối thành công — userId: ' + userId);

                    stompClient.subscribe('/user/' + userId + '/queue/messages', function (message) {
                        const body = JSON.parse(message.body);
                        log('📩 Nhận được: ' + JSON.stringify(body));
                    });
                },
                function (error) {
                    log('❌ Lỗi WebSocket: ' + error);
                }
            );
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect();
                stompClient = null;
                log('🔌 Đã ngắt kết nối');
            }
        }

        function sendMessage() {
            const receiverId = document.getElementById('receiverIdInput').value;
            const content = document.getElementById('contentInput').value;

            if (!stompClient || !stompClient.connected) {
                log('⚠️ Chưa kết nối WebSocket');
                return;
            }

            stompClient.send('/app/chat.send', {}, JSON.stringify({
                receiverId: receiverId,
                content: content
            }));

            log(`📤 Đã gửi đến userId: ${receiverId} — "${content}"`);
        }
    </script>
</body>
</html>
